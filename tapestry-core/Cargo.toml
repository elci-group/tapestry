[package]
name = "tapestry-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Tapestry programme contracts: identity, session, artefact, review, telemetry and TAP/1 protocol schemas"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
semver = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
