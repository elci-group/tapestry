# kaptaind configuration — version authority for the tapestry programme

[watch]
path = "."
recursive = true
ignore_file = ".kaptainignore"

[cluster]
window = 5

[weights]
s = 0.35
a = 0.30
d = 0.20
r = 0.15

[version_thresholds]
minor = 0.6
patch = 0.1

[push]
enabled = true
branch = "main"

[capabilities]
network_push = true

[ratelimit]
min_commit_interval = 10

[test]
command = "cargo test"
required = true

[operation]
mode = "actuate"

[trust]
execution = "trusted"
